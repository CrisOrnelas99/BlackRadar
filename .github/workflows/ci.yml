name: BlackRadar CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: blackradar-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    name: Format and static checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: BlackRadar/go.mod
          cache-dependency-path: BlackRadar/go.sum

      - name: Check Go formatting
        working-directory: BlackRadar
        run: |
          formatted_files="$(gofmt -l .)"
          if [ -n "$formatted_files" ]; then
            echo "The following Go files need formatting:"
            echo "$formatted_files"
            exit 1
          fi

      - name: Run go vet
        working-directory: BlackRadar
        run: go vet ./...

  testing:
    name: Testing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: BlackRadar/go.mod
          cache-dependency-path: BlackRadar/go.sum

      - name: Run Go tests
        working-directory: BlackRadar
        run: go test ./...

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BlackRadar/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: BlackRadar/ui
        run: npm ci

      - name: Run frontend tests
        working-directory: BlackRadar/ui
        run: npx --no-install ng test --watch=false

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: BlackRadar/go.mod
          cache-dependency-path: BlackRadar/go.sum

      - name: Run govulncheck
        working-directory: BlackRadar
        run: |
          tool_dir="$RUNNER_TEMP/go-tools"
          mkdir -p "$tool_dir"
          GOBIN="$tool_dir" go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$tool_dir/govulncheck" ./...

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BlackRadar/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: BlackRadar/ui
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: BlackRadar/ui
        run: npm audit --audit-level=high

      - name: Scan repository with Trivy
        id: trivy_fs_blocking
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Report medium repository findings with Trivy
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: MEDIUM
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-fs-medium.sarif
          exit-code: "0"

      - name: Upload medium repository findings
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('trivy-fs-medium.sarif') != ''
        uses: github/codeql-action/upload-sarif@24ea975727876cf496b1eb0c5b36e96e01600b51c # v4.37.0
        with:
          sarif_file: trivy-fs-medium.sarif
          category: trivy-fs-medium

      - name: Fail if blocking repository scan found findings
        if: steps.trivy_fs_blocking.outcome == 'failure'
        run: exit 1

  build:
    name: Build and container
    needs:
      - format-lint
      - testing
      - security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: BlackRadar/go.mod
          cache-dependency-path: BlackRadar/go.sum

      - name: Build backend artifact
        working-directory: BlackRadar
        run: |
          mkdir -p "$RUNNER_TEMP/blackradar-artifacts/backend"
          go build -o "$RUNNER_TEMP/blackradar-artifacts/backend/blackradar" .

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BlackRadar/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: BlackRadar/ui
        run: npm ci

      - name: Build frontend artifact
        working-directory: BlackRadar/ui
        run: |
          npm run build
          mkdir -p "$RUNNER_TEMP/blackradar-artifacts/frontend"
          cp -R dist/ui "$RUNNER_TEMP/blackradar-artifacts/frontend/dist"

      - name: Build backend container
        working-directory: BlackRadar
        run: docker build --tag blackradar:${{ github.sha }} .

      - name: Scan backend container with Trivy
        id: trivy_image_blocking
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: blackradar:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Report medium container findings with Trivy
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: blackradar:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: MEDIUM
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-image-medium.sarif
          exit-code: "0"

      - name: Upload medium container findings
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('trivy-image-medium.sarif') != ''
        uses: github/codeql-action/upload-sarif@24ea975727876cf496b1eb0c5b36e96e01600b51c # v4.37.0
        with:
          sarif_file: trivy-image-medium.sarif
          category: trivy-image-medium

      - name: Fail if blocking container scan found findings
        if: steps.trivy_image_blocking.outcome == 'failure'
        run: exit 1

      - name: Upload backend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blackradar-backend-${{ github.sha }}
          path: ${{ runner.temp }}/blackradar-artifacts/backend/blackradar
          if-no-files-found: error
          retention-days: 7

      - name: Upload frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blackradar-frontend-${{ github.sha }}
          path: ${{ runner.temp }}/blackradar-artifacts/frontend/dist
          if-no-files-found: error
          retention-days: 7
