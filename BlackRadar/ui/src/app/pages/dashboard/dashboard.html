@if (session(); as currentSession) {
  <app-top-menu [session]="currentSession" currentUrl="/dashboard"></app-top-menu>
}

<section class="dashboard-shell" aria-labelledby="dashboard-heading">
  <header class="dashboard-page-header">
    <div class="dashboard-page-heading">
      <h1 id="dashboard-heading">Dashboard</h1>
      <p class="dashboard-page-subtitle">
        Review your security inventory and vulnerability-management activity from one place.
      </p>
    </div>
  </header>

  <div class="dashboard-card">
    <p class="dashboard-kicker">Authenticated</p>
    <p class="dashboard-copy">
      Signed in as <strong>{{ username || 'unknown user' }}</strong
      >.
    </p>
  </div>
</section>
