@if (session(); as currentSession) {
  <app-top-menu [session]="currentSession" currentUrl="/assets"></app-top-menu>
}

<section class="assets-page-shell" aria-labelledby="assets-heading">
  <div class="assets-page-header">
    <h1 id="assets-heading">Assets</h1>
  </div>

  @if (isLoading()) {
    <p class="assets-status" role="status" aria-atomic="true">Loading assets...</p>
  } @else if (hasLoadError()) {
    <p class="assets-status" role="alert">Unable to load assets.</p>
  } @else if (assets().length === 0) {
    <p class="assets-status" role="status" aria-atomic="true">No assets found.</p>
  } @else {
    <app-data-table
      [columns]="assetColumns"
      [rows]="assets()"
      (cellAction)="handleTableAction($event)"
    ></app-data-table>
  }
</section>
