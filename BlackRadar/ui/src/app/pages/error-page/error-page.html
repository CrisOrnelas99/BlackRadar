<app-page-layout class="error-page-shell" role="main" aria-labelledby="error-page-title">
  <div class="error-page-stage">
    <div class="error-page-brand" aria-label="BlackRadar">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3 19 6v5c0 4.5-2.8 8.1-7 10-4.2-1.9-7-5.5-7-10V6l7-3Z" />
        <path d="M12 8v4" />
        <path d="M12 16h.01" />
      </svg>
      <span>BlackRadar</span>
    </div>

    <article class="error-page-card">
      <div class="error-page-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 3 21 19H3L12 3Z" />
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
        </svg>
      </div>

      <p class="error-page-code">{{ definition.code }}</p>
      <h1 id="error-page-title">{{ definition.title }}</h1>
      <p class="error-page-message">{{ definition.message }}</p>

      <div class="error-page-actions">
        @if (definition.canRetry) {
          <button
            type="button"
            class="error-page-button error-page-button-secondary"
            (click)="retry()"
          >
            Try again
          </button>
        }
        <button type="button" class="error-page-button" (click)="navigateToPrimaryAction()">
          {{ primaryActionLabel }}
        </button>
      </div>
    </article>
  </div>
</app-page-layout>
